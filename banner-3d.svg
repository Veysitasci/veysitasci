<svg viewBox="0 0 900 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font: 900 42px 'Segoe UI', system-ui, sans-serif; fill: url(#titleGrad); letter-spacing: 3px; }
      .subtitle { font: 600 15px 'JetBrains Mono', Consolas, monospace; fill: #38bdf8; }
      .meta { font: 500 13px 'JetBrains Mono', Consolas, monospace; fill: #94a3b8; }
      .float-1 { animation: floatA 5s ease-in-out infinite; }
      .float-2 { animation: floatB 3.8s ease-in-out infinite; }
      .float-3 { animation: floatA 4.4s ease-in-out infinite reverse; }
      .pulse { animation: pulseGlow 3.5s ease-in-out infinite; }
      @keyframes floatA { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
      @keyframes floatB { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(12px); } }
      @keyframes pulseGlow { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }
    </style>
  </defs>

  <!-- 3D Ana Gövde -->
  <rect width="900" height="240" rx="22" fill="url(#bg)" stroke="#334155" stroke-width="2" />

  <!-- Perspektif Siber Izgara -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.75">
    <line x1="0" y1="185" x2="900" y2="185" />
    <line x1="0" y1="215" x2="900" y2="215" />
    <line x1="450" y1="110" x2="50" y2="240" />
    <line x1="450" y1="110" x2="250" y2="240" />
    <line x1="450" y1="110" x2="450" y2="240" />
    <line x1="450" y1="110" x2="650" y2="240" />
    <line x1="450" y1="110" x2="850" y2="240" />
  </g>

  <!-- Neon Atmosfer Işıkları -->
  <circle cx="730" cy="115" r="90" fill="#9333ea" opacity="0.3" filter="url(#glow)" class="pulse" />
  <circle cx="180" cy="120" r="75" fill="#0284c7" opacity="0.25" filter="url(#glow)" />

  <!-- Sol 3D Glassmorphism Terminal Kartı -->
  <g transform="translate(40, 28)">
    <rect width="545" height="184" rx="16" fill="url(#glass)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="24" cy="24" r="6" fill="#ef4444" />
    <circle cx="44" cy="24" r="6" fill="#eab308" />
    <circle cx="64" cy="24" r="6" fill="#22c55e" />
    <text x="88" y="28" font-family="monospace" font-size="12" fill="#64748b">veysitasci@dolunay-digital: ~/3d-workspace</text>

    <text x="28" y="88" class="title">VEYSİ TAŞÇI</text>
    <text x="28" y="122" class="subtitle">&gt; Full-Stack • Mobile • 2.5D/3D Game Architect_</text>
    <text x="28" y="154" class="meta">⚡ React Native  |  🎮 Godot 4 &amp; C++  |  🐧 Linux &amp; AI</text>
  </g>

  <!-- Sağ 3D İzometrik Yüzen Küp Kümesi -->
  <g transform="translate(725, 95)">
    <g class="float-1">
      <polygon points="0,-55 60,-25 0,5 -60,-25" fill="url(#cubeTop)" />
      <polygon points="-60,-25 0,5 0,75 -60,45" fill="url(#cubeLeft)" />
      <polygon points="60,-25 0,5 0,75 60,45" fill="url(#cubeRight)" />
    </g>
    <g class="float-2" transform="translate(85, 60) scale(0.55)">
      <polygon points="0,-55 60,-25 0,5 -60,-25" fill="url(#cubeTop)" />
      <polygon points="-60,-25 0,5 0,75 -60,45" fill="url(#cubeLeft)" />
      <polygon points="60,-25 0,5 0,75 60,45" fill="url(#cubeRight)" />
    </g>
    <g class="float-3" transform="translate(-85, 68) scale(0.48)">
      <polygon points="0,-55 60,-25 0,5 -60,-25" fill="url(#cubeTop)" />
      <polygon points="-60,-25 0,5 0,75 -60,45" fill="url(#cubeLeft)" />
      <polygon points="60,-25 0,5 0,75 60,45" fill="url(#cubeRight)" />
    </g>
  </g>
</svg>
